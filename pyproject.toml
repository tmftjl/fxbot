[project]
name = "fxbot"
version = "0.1.0"
description = "FxBot standalone messaging application"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "pydantic>=2.14,<3",
    "sqlmodel==0.0.42",
    "sqlalchemy>=2.0.57,<2.1",
    "aiosqlite>=0.22,<0.23",
    "httpx[socks]>=0.28.1,<0.29",
    "cryptography>=48,<49",
    "openai>=3.46,<4",
    "fastapi>=0.162,<0.164",
    "uvicorn>=0.54,<0.55",
    "websockets>=17.4,<18",
    "Pillow>=13,<14",
    "numpy>=2.2.6,<3",
    "scipy>=1.14,<2",
    "jieba>=0.42.1,<0.43",
    "json-repair>=0.60.1,<0.61",
    "ahocorasick-rs>=1.0.3,<2",
    "faiss-cpu>=1.15,<2",
    "playwright>=1.64,<2",
    "psutil>=7.2,<8",
    "pypinyin>=0.55,<0.56",
    "curl_cffi>=0.17,<0.18",
    "packaging>=26,<27",
]

[project.optional-dependencies]
dev = ["build>=1.6,<2", "pdm-backend>=2.5,<3", "ruff>=0.17,<0.18", "mypy>=1.10,<2"]

[tool.mypy]
files = ["src/fxbot/core"]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true

[project.scripts]
fxbot = "fxbot.runtime.cli:main"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
# src 布局按 fxbot 包交付；资源、模板、前端产物和插件声明文件随包默认包含。
excludes = ["src/fxbot/console/web/node_modules"]
