[project]
name = "fxbot"
version = "0.1.0"
description = "FxBot NoneBot plugin"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi,httpx]",
    "nonebot-adapter-onebot",
    "nonebot-adapter-qq",
    "nonebot-plugin-apscheduler",
    "pydantic",
    "sqlmodel==0.0.42",
    "sqlalchemy",
    "aiosqlite",
    "httpx[socks]",
    "openai>=1.0.0",
    "fastapi",
    "Pillow>=10.1",
    "numpy>=2.2.6",
    "scipy>=1.7.0",
    "jieba>=0.42.1",
    "json-repair>=0.60.1,<0.61",
    "ahocorasick-rs>=1.0.3",
    "faiss-cpu>=1.11.0",
    "playwright>=1.40",
    "psutil>=5.9.0",
    "arclet-alconna>=1.8.35,<2.0",
    "matplotlib>=3.7.0",
    "pypinyin>=0.44.0,<1.0.0",
    "python-dateutil>=2.8.2",
    "PyYAML>=6.0",
    "rapidfuzz>=3.9.0",
    "curl_cffi>=0.13.0,<1.0.0,!=0.14.0",
    "bilibili-api-python>=17.4.1,<18.0.0",
]

[project.optional-dependencies]
dev = ["build", "setuptools>=61", "wheel", "ruff"]

[project.entry-points."nonebot.plugins"]
fxbot = "fxbot"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {fxbot = ".", core = "core"}

[tool.setuptools.package-data]
"*" = ["resources/**/*", "resource/**/*", "*.json"]
fxbot = ["resources/**/*", "console/web/dist/**/*"]
"fxbot.chat" = ["prompts/*.prompt"]
"fxbot.chat.amemorix" = ["prompts/**/*.prompt"]
"fxbot.plugins.help" = ["resources/**/*"]
"fxbot.plugins.wuwa_emoji" = ["char_alias.json"]
"fxbot.plugins.video_parser.parsers" = ["a_bogus.cjs"]
"fxbot.plugins.infinite_gen2" = ["LICENSE"]
