[project]
name = "fxbot"
version = "0.1.0"
description = "FxBot standalone messaging application"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "pydantic",
    "sqlmodel==0.0.42",
    "sqlalchemy",
    "aiosqlite",
    "httpx[socks]",
    "cryptography>=43.0.3",
    "openai>=1.0.0",
    "fastapi",
    "uvicorn",
    "websockets>=15",
    "Pillow>=10.1",
    "numpy>=2.2.6",
    "scipy>=1.7.0",
    "jieba>=0.42.1",
    "json-repair>=0.60.1,<0.61",
    "ahocorasick-rs>=1.0.3",
    "faiss-cpu>=1.11.0",
    "playwright>=1.40",
    "psutil>=5.9.0",
    "pypinyin>=0.44.0,<1.0.0",
    "curl_cffi>=0.13.0,<1.0.0,!=0.14.0",
]

[project.optional-dependencies]
dev = ["build", "setuptools>=61", "wheel", "ruff", "packaging"]

[project.scripts]
fxbot = "fxbot.runtime.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["fxbot", "fxbot.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = [
    "resources/**/*",
    "resource/**/*",
    "prompts/*.prompt",
    "prompts/**/*.prompt",
    "web/dist/**/*",
    "*.json",
    "*.cjs",
    "LICENSE",
    "requirements.txt",
]
