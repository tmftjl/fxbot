name: fxbot

services:
  fxbot:
    build:
      context: .
      # 构建阶段也使用宿主机网络，才能访问 127.0.0.1:7890 上的 mihomo。
      network: host
      # PROXY_URL 在 .env 中设置后，构建期的 apt / uv / Playwright 下载都会走代理。
      args:
        HTTP_PROXY: ${PROXY_URL:-}
        HTTPS_PROXY: ${PROXY_URL:-}
        ALL_PROXY: ${PROXY_URL:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
        http_proxy: ${PROXY_URL:-}
        https_proxy: ${PROXY_URL:-}
        all_proxy: ${PROXY_URL:-}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1}
        # 构建期下载源，见 .env.example。默认官方源 + 代理；
        # 只有不走代理时才考虑腾讯云 / 阿里云 / 清华镜像，不引入第三方源。
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
    image: fxbot:local
    # 复用本地镜像，不访问 registry；镜像不存在时由 build 构建。
    # 日常改源码只需重启容器；改了依赖或 Dockerfile 再执行 docker compose build。
    pull_policy: never
    container_name: fxbot
    restart: unless-stopped
    init: true
    # 容器以宿主机用户的身份运行（root 服务器上就是 root），
    # 这样容器内 #更新 的 git pull 和你手动 git pull 写出的文件属主一致，
    # 不需要任何 chown。需要最小权限时在 .env 里设 FXBOT_UID=1000、FXBOT_GID=1000。
    user: "${FXBOT_UID:-0}:${FXBOT_GID:-0}"
    # 仅适用于 Linux：容器直接使用宿主机网络栈，
    # 因此容器内的 127.0.0.1 就是宿主机，可以直接访问本机 mihomo。
    # 注意：host 模式下 ports 映射无效，fxbot 直接监听宿主机端口。
    network_mode: host
    # Chromium 渲染长图时依赖共享内存，太小容易崩溃。
    shm_size: "1gb"
    command:
      - /app/.venv/bin/python
      - -m
      - fxbot
      - --host
      - "${FXBOT_BIND:-127.0.0.1}"
      - --port
      - "${FXBOT_PORT:-8683}"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # host 网络下 127.0.0.1 就是宿主机，插件请求和启动时补装依赖都会走 mihomo。
      # 健康检查访问 127.0.0.1，因此必须保留 NO_PROXY。
      HTTP_PROXY: ${PROXY_URL:-}
      HTTPS_PROXY: ${PROXY_URL:-}
      ALL_PROXY: ${PROXY_URL:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
      http_proxy: ${PROXY_URL:-}
      https_proxy: ${PROXY_URL:-}
      all_proxy: ${PROXY_URL:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1}
    volumes:
      # 直接复用项目根目录的 data/：配置、数据库、缓存和下载资源都在里面。
      - ./data:/app/data
      # 源码以 editable 方式安装，挂载后改代码只需重启容器，不用重新 build。
      # 新增或修改 pyproject.toml / uv.lock 仍需重新 build。
      - ./src:/app/src
      # 容器内 #更新 通过这个挂载执行 git pull。
      # 默认以 root 运行，与宿主机上的 git 操作属主一致；若改用 FXBOT_UID=1000，
      # 则需要整个仓库（含 .git）都归 1000，否则 git pull 会写不了 .git/FETCH_HEAD。
      - ./:/repo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
